<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · BenedettoWebs</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../documentos/doc.css">
<link rel="stylesheet" href="panel.css">
</head>
<body class="panel">

<main class="login" id="login" hidden>
  <img src="../img/logo/logo-fondo-claro.svg" alt="BenedettoWebs">
  <div class="caja-panel">
    <h2>Panel privado</h2>
    <p class="mensaje" id="msgLogin"></p>
    <button class="btn" id="entrar">Entrar con Google</button>
  </div>
</main>

<main class="login" id="sinConfig" hidden>
  <img src="../img/logo/logo-fondo-claro.svg" alt="BenedettoWebs">
  <div class="caja-panel">
    <h2>Falta conectar Firebase</h2>
    <p class="mensaje">Pega la configuración de tu proyecto en <code>panel/firebase.js</code>. Los pasos están en <code>panel/CONFIGURAR.md</code>.</p>
  </div>
</main>

<div class="app" id="app" hidden>
<nav class="menu" id="menu"></nav>
<main class="panel-wrap">
  <header class="panel-head">
    <div class="titulos">
      <h1>Clientes</h1>
      <p class="bajada">Tus proyectos, cotizaciones y lo que necesita atención.</p>
    </div>
    <a class="btn" href="cliente.html">+ Nuevo cliente</a>
  </header>

  <div class="cifras" id="cifras"></div>
  <section class="caja-panel" id="atender" hidden>
    <h2>Para atender</h2>
    <ul class="docs atender" id="listaAtender"></ul>
  </section>

  <div class="filtros">
    <input class="buscar" id="buscar" type="search" placeholder="Buscar por nombre, negocio, correo o RUT">
    <div class="filtros" id="chips" style="margin:0"></div>
  </div>

  <div class="clientes" id="lista"></div>
  <p class="vacio" id="vacio" hidden></p>
</main>
</div>

<script type="module" src="index.js"></script>
</body>
</html>
