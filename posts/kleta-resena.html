<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Post: Reseña de José</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1a;
    --surface: #151c33;
    --border: rgba(255, 255, 255, 0.08);
    --text: #e8ecf6;
    --muted: #9aa4bf;
    --primary: #6c63ff;
    --secondary: #00d4ff;
    --kleta: #e8262d;
    --gold: #ffc940;
    --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); }
  .post {
    width: 1080px; height: 1350px; padding: 64px 84px 56px;
    font-family: 'Outfit', sans-serif; color: var(--text);
    background:
      radial-gradient(700px 500px at 100% 0%, rgba(108, 99, 255, .28), transparent 70%),
      radial-gradient(650px 520px at 0% 100%, rgba(232, 38, 45, .18), transparent 70%),
      var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .logo { height: 54px; align-self: flex-start; }
  .eyebrow {
    margin-top: 34px; font-family: 'JetBrains Mono', monospace; font-size: 26px;
    color: var(--secondary); letter-spacing: .5px;
  }
  h1 { margin-top: 10px; font-size: 72px; line-height: 1.03; font-weight: 800; letter-spacing: -2px; }
  .grad { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .quote {
    margin-top: 36px; position: relative; background: var(--surface); border: 1px solid var(--border);
    border-left: 6px solid var(--kleta); border-radius: 28px; padding: 40px 48px 36px 48px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, .4);
  }
  .quote .mark {
    position: absolute; right: 36px; top: -18px; font-size: 220px; line-height: 1; font-weight: 800;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: .9;
  }
  .stars { color: var(--gold); font-size: 40px; letter-spacing: 6px; }
  .quote blockquote {
    margin-top: 18px; font-size: 44px; line-height: 1.3; font-weight: 600; letter-spacing: -.5px;
  }
  .quote blockquote em { font-style: normal; color: var(--secondary); }
  .who { margin-top: 30px; display: flex; align-items: center; gap: 20px; }
  .avatar {
    width: 76px; height: 76px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--kleta), #ff7a45);
    display: grid; place-items: center; font-size: 36px; font-weight: 800; color: #fff;
  }
  .who div b { display: block; font-size: 30px; font-weight: 700; }
  .who div span { display: block; margin-top: 2px; font-family: 'JetBrains Mono', monospace; font-size: 21px; color: var(--muted); }

  .site {
    margin-top: 30px; display: flex; gap: 26px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 18px;
  }
  .site img { width: 400px; height: 270px; object-fit: cover; object-position: top; border-radius: 14px; flex: none; }
  .site ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }
  .site li { font-size: 25px; line-height: 1.25; display: flex; gap: 12px; }
  .site li .ico { font-size: 26px; }

  .foot {
    margin-top: auto; display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 25px; color: var(--muted);
  }
  .foot b { color: var(--text); font-weight: 700; }
  .foot .contact { display: flex; flex-direction: column; gap: 4px; }
  .foot .mail { font-size: 21px; }
  .foot .visit {
    padding: 14px 28px; border-radius: 999px; background: var(--gradient);
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 25px; color: #fff;
  }
</style>
</head>
<body>
<div class="post">
  <img class="logo" src="../img/logo/logo-fondo-oscuro.svg" alt="BenedettoWebs">

  <p class="eyebrow">&gt; lo que dicen mis clientes_</p>
  <h1>La reseña de José,<br><span class="grad">Taller de la Kleta</span> 🚲</h1>

  <figure class="quote">
    <span class="mark" aria-hidden="true">”</span>
    <div class="stars">★★★★★</div>
    <blockquote>“Muy práctico y rápido a la hora de diseñar la web, <em>precios excelentes</em> y muy buena dedicación en los detalles, ¡muchas gracias!”</blockquote>
    <div class="who">
      <div class="avatar">J</div>
      <div><b>José</b><span>Taller de la Kleta · La Reina</span></div>
    </div>
  </figure>

  <div class="site">
    <img src="kleta-captura.png" alt="Portada del sitio tallerdelakleta.cl">
    <ul>
      <li><span class="ico">📅</span>Agenda de horas, taller o domicilio</li>
      <li><span class="ico">🛒</span>Tienda de repuestos con pedido por WhatsApp</li>
      <li><span class="ico">✏️</span>Panel propio para cambiar precios y productos</li>
    </ul>
  </div>

  <div class="foot">
    <span class="contact"><b>benedettowebs.cl</b><span class="mail">sabenedettoa@benedettowebs.cl</span></span>
    <span class="visit">Visita tallerdelakleta.cl ›</span>
  </div>
</div>
</body>
</html>
